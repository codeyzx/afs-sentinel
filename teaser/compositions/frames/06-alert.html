    (function () {
      const ID = "06-alert";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const $ = (n) => document.getElementById("f" + ID + "-" + n);
      const all = (attr) => Array.from(root.querySelectorAll("[" + attr + "]"));
      const tl = gsap.timeline({ paused: true });

      // camera poses: origin 0 0; centring frame point (cx,cy) at (fx,fy) with scale s
      const pose = (cx, cy, s, fx, fy) => ({ scale: s, x: fx - s * cx, y: fy - s * cy });
      const WIDE = { scale: 1, x: 0, y: 0 };
      // bubble sits bottom-left of the chat, roughly centred at (655, 560)
      const P_MSG = pose(655, 560, 1.3, 860, 440);
      // opening: the whole chat panel, larger and centred, before the alert arrives
      const P_OPEN = pose(655, 461, 1.05, 960, 450);
      const cam = $("cam");

      // ---- Scene 1 (0–0.9s): panel rises; typing on "Begitu ada yang" ----
      tl.fromTo($("panel"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo($("typing"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "expo.out" }, 0.3);
      const dots = all("data-dot");
      const CYCLE = 0.42;
      dots.forEach((d, i) => {
        for (let t = 0.4 + i * 0.1; t + CYCLE <= 1.7; t += CYCLE) {
          tl.fromTo(d, { opacity: 0.35, y: 0 }, { opacity: 1, y: -6, duration: CYCLE / 2, ease: "sine.inOut", immediateRender: false }, t);
          tl.to(d, { opacity: 0.35, y: 0, duration: CYCLE / 2, ease: "sine.inOut" }, t + CYCLE / 2);
        }

      // ---- impact on "janggal" (0.91s): push banner slams down, frame shakes, avatar pings ----
      const T_HIT = 0.91;
      tl.fromTo($("notif"), { y: -220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "expo.out" }, T_HIT);
      tl.fromTo(
        $("shake"),
        { x: 0, y: 0 },
        {
          keyframes: [
            { x: -14, y: 6, duration: 0.05 },
            { x: 11, y: -4, duration: 0.06 },
            { x: -7, y: 3, duration: 0.06 },
            { x: 4, y: -1, duration: 0.07 },
            { x: 0, y: 0, duration: 0.08 },
          ],
          ease: "none",
        },
        T_HIT + 0.1
      );
      tl.fromTo($("flash"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, T_HIT + 0.08);
      tl.to($("flash"), { opacity: 0, duration: 0.6, ease: "power2.out" }, T_HIT + 0.16);
      tl.fromTo($("ping"), { opacity: 0.95, scale: 1 }, { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out", immediateRender: false }, T_HIT + 0.12);
      tl.fromTo($("ping"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // ---- Scene 2 (1.67s "peringatan"): banner hands off to the chat; bubble builds on cue words ----
      const T_MSG = 1.67;
      tl.to($("notif"), { y: -40, scale: 0.94, opacity: 0, duration: 0.3, ease: "power2.in" }, T_MSG - 0.05);
      tl.to($("typing"), { opacity: 0, scale: 0.8, duration: 0.12, ease: "power1.in" }, T_MSG - 0.02);
      tl.to(cam, { ...P_MSG, duration: 0.6, ease: "power3.inOut" }, T_MSG - 0.1);
      tl.fromTo($("bubble"), { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, T_MSG);
      // revealed bubble height per cue (px, measured from the laid-out bubble)
      const grow = [
        [T_MSG, 70],
        [2.06, 112],
        [2.34, 214],
        [2.59, 312],
        [2.76, 356],
        [2.86, 420],
      ];
      tl.fromTo($("bubble"), { "--h": "0px" }, { "--h": "0px", duration: 0.01 }, 0);
      grow.forEach(([t, h]) => {
        tl.to($("bubble"), { "--h": h + "px", duration: 0.24, ease: "power3.out" }, t);
      });
      const cue = [
        ["l1", T_MSG + 0.02], // "peringatan"
        ["l2", 2.06],         // "langsung"
        ["l3", 2.34],         // "masuk"
        ["l4", 2.59],         // "ke Telegram"
        ["l5", 2.76],
      ];
      cue.forEach(([id, t]) => {
        tl.fromTo($(id), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, t);
      });
      tl.fromTo($("time"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 2.86);

      // ---- Scene 3 ("Anda" 2.98s): camera pulls back, button arrives and gets one press ----
      tl.to(cam, { ...WIDE, duration: 0.55, ease: "power3.inOut" }, 2.92);
      tl.fromTo($("kbd"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 2.98);
      const PRESS = 3.5;
      tl.to($("btn"), { scale: 0.95, backgroundColor: "#1A2B3B", duration: 0.1, ease: "power1.in" }, PRESS);
      tl.to($("btn"), { scale: 1, backgroundColor: "#2A4158", duration: 0.4, ease: "power2.out" }, PRESS + 0.1);
      tl.fromTo($("ripple"), { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out", immediateRender: false }, PRESS + 0.05);
      tl.fromTo($("ripple"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // right column: rule + kicker, then h2 per-word rise from masks
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 3.0);
      tl.fromTo($("kicker"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 3.04);

      tl.set({}, {}, 5.0);

      window.__timelines[ID] = tl;
