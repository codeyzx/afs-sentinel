    <script>
      (function () {
        const $ = (id) => document.getElementById("f08-proof-" + id);
        const tl = gsap.timeline({ paused: true });

        // ---- camera math (pre-computed, no DOM measurement) ----
        // footage px (fx,fy) sits at cam-local (280 + K*fx, 112 + K*fy); with transform-origin 0 0,
        // centring it at frame (cx,cy) at scale s needs x = cx - s*lx, y = cy - s*ly.
        const K = 1360 / 1920;
        const pose = (fx, fy, mag, cx, cy) => {
          const s = mag / K;
          return { scale: s, x: cx - s * (280 + K * fx), y: cy - s * (112 + K * fy) };
        };
        const WIDE = { scale: 1, x: 0, y: 0 };
        // P1: first flag — 2021-Q1 point (218,614) with the y-axis and the dashed 8-Mei-2023 line in view
        const P1 = pose(560, 600, 1.7, 960, 430);
        // P2: the claim sentence "Pertama kali Sedang: 2021-Q1, 25 bulan sebelum…" (line 1, y≈158)
        const P2 = pose(515, 175, 1.9, 960, 380);
        // P3: push THROUGH the "25" glyph pair (footage x622–658, y142–175)
        const P3 = pose(640, 158, 30, 960, 400);

        const cam = $("cam");
        tl.fromTo(cam, WIDE, { ...WIDE, duration: 0.01 }, 0);

        // Scene 1 — kicker on "Diuji" (0.31s); real page scroll plays in the wide shot
        tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.3);
        // the HUD kicker leaves as the camera starts moving, so it never sits on zoomed UI
        tl.to($("kicker"), { opacity: 0, duration: 0.25, ease: "power1.in" }, 1.3);

        // push in to the first flag point, landing on "Sentinel" (1.88s)
        tl.to(cam, { ...P1, duration: 0.6, ease: "power3.inOut" }, 1.3);
        tl.fromTo($("spot-pt"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 1.82);
        tl.fromTo($("ripple"), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.6, duration: 0.6, ease: "power2.out", immediateRender: false }, 1.9);
        tl.fromTo($("pt-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.98);

        // travel up to the claim sentence on "menandai" (2.50s), landing on "Waskita" (2.86s)
        tl.to(cam, { ...P2, duration: 0.42, ease: "power3.inOut" }, 2.44);
        tl.to([$("spot-pt"), $("pt-label")], { opacity: 0, duration: 0.2, ease: "power1.out" }, 2.44);
        tl.fromTo($("spot-line"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.66);
        tl.fromTo($("marker"), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power2.out" }, 2.72);

        // Scene 3 seam — push THROUGH "25" (accelerating), red iris opens from the glyph
        tl.to(cam, { ...P3, duration: 0.36, ease: "power3.in" }, 3.06);
        tl.to([$("spot-line"), $("marker")], { opacity: 0, duration: 0.14, ease: "power1.in" }, 3.06);
        tl.fromTo(cam, { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.16, ease: "power2.in", immediateRender: false }, 3.24);
        const red = $("redfield");
        // the red register floods in as the camera goes through the glyphs
        tl.fromTo(red, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.in" }, 3.24);

        // Count-up 0 → 25 on "dua puluh lima" (3.28s) — counting-dynamic-scale
        const counter = $("counter");
        const state = { v: 0 };
        const COUNT_AT = 3.28;
        const COUNT_DUR = 1.5;
        tl.fromTo(
          state,
          { v: 0 },
          {
            v: 25,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: () => {
              counter.textContent = String(Math.round(state.v));
            },
          },
          COUNT_AT
        );
        tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
        tl.fromTo(
          counter,
          { opacity: 0, filter: "blur(18px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" },
          COUNT_AT
        );

        // "bulan" on its cue (3.74s)
        tl.fromTo($("unit"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.74);

        // "sebelum suspensi" (4.03s)
        const line = $("line");
        tl.fromTo(line.querySelector(".l-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 4.03);
        tl.fromTo(line.querySelector(".l-text"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.08);

        // Scene 4 (5.2s) — mono sub-line, then stillness
        const sub = $("sub");
        tl.fromTo(sub.querySelector(".s-hair"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 5.2);
        tl.fromTo(sub.querySelector(".s-text"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.3);

        // camera rig and HUD are fully covered by the red field — hide them explicitly
        tl.set([cam, $("kicker"), $("band")], { autoAlpha: 0 }, 3.46);

        // hold to the frame's full length
        tl.to({}, { duration: 0.001 }, 7.59);

        window.__timelines = window.__timelines || {};
        window.__timelines["08-proof"] = tl;
      })();
