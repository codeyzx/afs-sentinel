    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const $ = function (n) { return document.getElementById("f04-" + n); };

        // ---- camera geometry (constants; the screen is 1680x780 at frame (120,100)) ----
        const W = 1680, H = 780, OX = 120, OY = 100;
        function pose(cx, cy, s) {
          let x = W / 2 - s * cx, y = H / 2 - s * cy;
          x = Math.min(0, Math.max(W - 1920 * s, x));
          y = Math.min(0, Math.max(H - 1080 * s, y));
          return { x: x, y: y, scale: s };
        }
        function toFrame(p, sx, sy) { return { x: OX + p.x + p.scale * sx, y: OY + p.y + p.scale * sy }; }

        const P0 = pose(960, 390, 1);        // app content column at 1:1
        const PD = pose(560, 250, 1.75);      // dashboard status card: "tiap 3 hari" + "Berikutnya"
        const PL = pose(720, 450, 1.7);      // /logs: Pemicu + Dipindai columns, first rows
        const PE = pose(660, 540, 1.45);     // expanded run: per-emiten list

        const cam = $("cam");
        gsap.set(cam, { transformOrigin: "0 0" });

        // place frame-space callouts from the poses they annotate
        (function place() {
          const colL = toFrame(PL, 688, 316);                 // left edge of Pemicu column, newest run row
          const call = $("call-col");
          call.style.left = Math.round(colL.x - 24 - 360) + "px";
          call.style.top = Math.round(colL.y - 56) + "px";
          const lead = $("leader-col");
          lead.style.left = Math.round(colL.x - 24) + "px";
          lead.style.width = "16px";
          lead.style.top = Math.round(colL.y - 1) + "px";
          const stat = $("stat");
          stat.style.left = "1340px";
          stat.style.top = "556px";
        })();

        tl.set($("url-b"), { opacity: 0 }, 0);

        // Scene 1 (0.0–1.45): window rises, dashboard, punch-in to the schedule on "Setiap tiga hari"
        tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0);
        tl.fromTo($("window"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 0);
        tl.fromTo(cam, { x: P0.x, y: P0.y, scale: P0.scale }, { x: PD.x, y: PD.y, scale: PD.scale, duration: 0.6, ease: "power3.inOut" }, 0.3);
        tl.fromTo($("pill-1"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
        tl.fromTo($("spot-dash"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.62);
        tl.fromTo($("ring-days"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.66);
        tl.to($("ring-days"), { opacity: 0.35, duration: 0.2, ease: "power2.out" }, 1.0);
        tl.fromTo($("ring-next"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 1.0);

        // Scene 2 (1.45): hard cut to /logs — the camera cuts with the footage
        tl.set([$("spot-dash"), $("ring-days"), $("ring-next")], { opacity: 0 }, 1.45);
        tl.set($("url-a"), { opacity: 0 }, 1.45);
        tl.set($("url-b"), { opacity: 1 }, 1.45);
        tl.set(cam, { x: PL.x, y: PL.y, scale: PL.scale }, 1.45);
        tl.fromTo($("pill-2"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.45);
        // every run row: "Otomatis · sistem"
        tl.fromTo($("spot-col"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.5);
        tl.fromTo($("ring-col"), { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.45, ease: "power2.inOut" }, 1.5);
        tl.fromTo($("leader-col"), { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 1.62);
        tl.fromTo($("call-col"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.7);
        // the real click on the newest run (footage 0.55s) expands it
        tl.to([$("spot-col"), $("ring-col")], { opacity: 0, duration: 0.2, ease: "power2.in" }, 1.86);
        tl.fromTo($("tapdot"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, 1.9);
        tl.to($("tapdot"), { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, 2.1);
        tl.fromTo($("ripple"), { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 2.2, duration: 0.55, ease: "power2.out", immediateRender: false }, 1.95);
        tl.fromTo($("spot-row"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.02);
        tl.fromTo($("ring-row"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.08);

        // Scene 3 (2.86): "menarik data Sectors API" — pull back before the footage scrolls (3.1)
        tl.fromTo($("pill-3"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.86);
        tl.to([$("spot-row"), $("ring-row"), $("call-col"), $("leader-col")], { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.86);
                tl.to(cam, { x: P0.x, y: P0.y, scale: P0.scale, duration: 0.65, ease: "power2.inOut" }, 2.9);

        // Scene 4 (4.3): "memindai tiga puluh tiga emiten" — punch into the per-emiten list, count 0 → 33
        tl.to(cam, { x: PE.x, y: PE.y, scale: PE.scale, duration: 0.65, ease: "power3.inOut" }, 4.3);
        tl.fromTo($("spot-emiten"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.8);
        tl.fromTo($("ring-emiten"), { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: "power2.inOut" }, 4.8);

        const COUNT_AT = 4.3, COUNT_DUR = 1.6, COUNT_EASE = "power3.out";
        const counter = $("counter");
        const state = { value: 0 };
        tl.fromTo($("stat"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, COUNT_AT);
        tl.fromTo(state, { value: 0 }, {
          value: 33,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () { counter.textContent = String(Math.round(state.value)); }
        }, COUNT_AT);
        tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
        tl.fromTo($("fill"), { scaleX: 0 }, { scaleX: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

        // release the zoom before the slide-out at 7.032
        tl.to([$("spot-emiten"), $("ring-emiten")], { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.3);
        tl.to(cam, { x: P0.x, y: P0.y, scale: P0.scale, duration: 0.6, ease: "power2.inOut" }, 6.35);

        tl.set({}, {}, 7.032);

        window.__timelines["04-autonomous"] = tl;
      })();
