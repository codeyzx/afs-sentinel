  <script>
    (function () {
      var FID = "02-twist";
      var END = 8.428;
      var F = 1 / 60;
      var tl = gsap.timeline({ paused: true });
      var byId = function (id) { return document.getElementById(id); };

      // ---- the 33 real Universe tickers, laid out on three depth planes (fixed math, no randomness)
      var T = ["ASII","UNTR","TLKM","EXCL","ISAT","TOWR","UNVR","ICBP","INDF","MYOR","CPIN",

               "AKRA","BRPT","EMTK","SIDO","TPIA","INCO","INTP","AADI","AMRT","SMGR","PTBA"];
      var PLANES = [
        // id, cols, rows, x0, y0, dx, dy, row shift, ticker offset
        { id: "f02-twist-far",  cols: 11, rows: 11, x0: -60, y0: 20,  dx: 190, dy: 80,  shift: 95,  off: 0 },
        { id: "f02-twist-mid",  cols: 7,  rows: 7,  x0: -40, y0: 40,  dx: 300, dy: 128, shift: 150, off: 11 },
        { id: "f02-twist-near", cols: 4,  rows: 4,  x0: -120, y0: 30, dx: 560, dy: 230, shift: 280, off: 22 }
      ];
      var rowsByPlane = [];
      PLANES.forEach(function (p) {
        var host = byId(p.id);
        var rows = [];
        for (var r = 0; r < p.rows; r++) {
          var row = [];
          for (var c = 0; c < p.cols; c++) {
            var d = document.createElement("div");
            d.className = "f02-twist-tick";
            d.setAttribute("data-layout-allow-overlap", "");
            d.setAttribute("data-layout-allow-occlusion", "");
            d.textContent = T[(p.off + r * 5 + c * 7) % T.length];
            d.style.left = (p.x0 + c * p.dx + (r % 2) * p.shift) + "px";
            d.style.top = (p.y0 + r * p.dy) + "px";
            host.appendChild(d);
            row.push(d);
          }
          rows.push(row);
        }
        rowsByPlane.push(rows);
      });

      // ---- camera drift over the type (Scenes 1–3)
      var stack = byId("f02-twist-stack");
      tl.fromTo(stack, { scale: 1.04, x: 0 }, { scale: 1, x: 24, duration: 4.8, ease: "none" }, 0);

      // ---- Scenes 1–3: per-word arrivals, whip up from below
      var words = stack.getElementsByClassName("f02-twist-word");
      Array.prototype.forEach.call(words, function (el) {
        var at = Number(el.dataset.at);
        var off = Number(el.dataset.off);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, at);
        tl.fromTo(el, { y: off, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.24, ease: "power4.out" }, at);
      });

      // ---- Scene 3: keyword glow on "bertahun-tahun"
      var glowEl = byId("f02-twist-glow");
      tl.fromTo(glowEl, { textShadow: "0 0 0px rgba(255,122,112,0)" },
        { textShadow: "0 0 44px rgba(255,122,112,0.85)", duration: 0.18, ease: "none" }, 2.727);
      tl.to(glowEl, { textShadow: "0 0 6px rgba(255,122,112,0.1)", duration: 0.45, ease: "none" }, 3.341);

      // ---- Scene 4 (on "Tapi" 4.74): the sentence leaves the frame; the wall floods in
      tl.to(stack, { y: -90, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 4.62);

      var PLANE_OPACITY = [0.22, 0.4, 0.55];
      var PLANE_START = [4.72, 4.8, 4.92];
      rowsByPlane.forEach(function (rows, pi) {
        rows.forEach(function (row, r) {
          row.forEach(function (el, c) {
            var at = PLANE_START[pi] + r * 0.05 + c * 0.012;
            tl.fromTo(el, { opacity: 0 }, { opacity: PLANE_OPACITY[pi], duration: F, ease: "none" }, at);
            tl.fromTo(el, { y: 30 + pi * 24 }, { y: 0, duration: 0.22, ease: "power4.out" }, at);
          });
        });
      });
      // parallax drift — nearer planes travel further
      var planes = [byId("f02-twist-far"), byId("f02-twist-mid"), byId("f02-twist-near")];
      var DRIFT = [-30, -80, -200];
      planes.forEach(function (pl, i) {
        tl.fromTo(pl, { x: 0 }, { x: DRIFT[i], duration: END - 4.72, ease: "none" }, 4.72);
      });

      // one red scan line crosses the wall
      var scan = byId("f02-twist-scan");
      tl.fromTo(scan, { opacity: 0 }, { opacity: 0.8, duration: 0.1, ease: "none" }, 5.0);
      tl.fromTo(scan, { x: 0 }, { x: 1920, duration: 0.9, ease: "power2.inOut" }, 5.0);
      tl.to(scan, { opacity: 0, duration: 0.1, ease: "none" }, 5.8);

      // ---- Scene 5 (on "semuanya" 5.94): clutter shoved outward, the question opens the center
      var SHOVE = 5.94;
      var PUSH = [1.18, 1.45, 1.9];
      var DIM = [0.12, 0.18, 0.14];
      planes.forEach(function (pl, i) {
        tl.fromTo(pl, { scale: 1 }, { scale: PUSH[i], duration: 1.0, ease: "expo.out", immediateRender: false }, SHOVE);
        tl.to(pl, { opacity: DIM[i] / PLANE_OPACITY[i], duration: 0.5, ease: "power3.out" }, SHOVE);
      });
      var q = byId("f02-twist-qplate");
      tl.fromTo(q, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, SHOVE + 0.06);
      tl.fromTo(q, { scale: 1.25, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, SHOVE + 0.06);
      // slow settle so the held question is never frozen

      tl.set({}, {}, END);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
