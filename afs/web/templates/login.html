{% extends "base.html" %}
{% block title %}{{ 'login.title' | t }}{% endblock %}
{% block content %}
<section class="max-w-sm mx-auto mt-6">
  <h1 class="font-display text-2xl font-semibold">{{ 'login.heading' | t }}</h1>
  <p class="mt-1 muted text-sm">{{ 'login.subtitle' | t }}</p>
  <form method="post" action="/login" class="panel mt-4 p-4 space-y-3">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">
      <span class="muted">{{ 'login.password' | t }}</span>
      <input type="password" name="password" class="field mt-1" autocomplete="current-password" required autofocus
        {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
    </label>
    {% if error %}<p id="login-error" class="text-sm tone-red">{{ error }}</p>{% endif %}
    <button type="submit" class="btn w-full">{{ 'login.submit' | t }}</button>
  </form>
</section>
{% endblock %}
