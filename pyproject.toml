[project]
name = "afs-sentinel"
version = "0.1.0"
description = "Autonomous Forensic Sentinel — forensic early-warning screening for IDX Emiten"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
